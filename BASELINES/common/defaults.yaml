seed: 42
precision: bfloat16
cpu_threads: 4
data:
  batch_size: 8
  num_workers: 4
  eval_clips: 1
  num_sentence: 0
optimization:
  epochs: 20
  lr: 0.0001
  weight_decay: 0.05
  betas: [0.9, 0.95]
  fused: true
  warmup_steps: 0
  clip_grad_norm: 1.0
  gradient_accumulation: 1
  loss:
    class_weighting: none
