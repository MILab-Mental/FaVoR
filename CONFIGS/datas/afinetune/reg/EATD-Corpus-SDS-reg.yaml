# 3_EATD-Corpus_SA.csv :: SDS :: regression
# 回归，范围 20~66
data:
  datasets:
  - /home/data/sdc/FAVOR/DATASET/splits-0901/3_EATD-Corpus_SA.csv
  datasets_weights:
  - 1
  rootpaths:
  - /home/data/sdb/基座模型数据集/3心理数据集/EATD-Corpus/
  batch_size: 64
  crop_size: 112
  patch_size: 16
  dataset_fpcs:
  - 48
  tubelet_size: 2
  fps: 4
  num_workers: 8
  persistent_workers: true
  pin_mem: true
  num_clips: 1

