# 2_RAVDESS_SV.csv :: intensity :: classification (2 classes)
# NOTE: RAVDESS `intensity` 为 0-based 标签 (0=normal, 1=strong)，而
#   VideoCSVDataset 目前按 `int(label)-1` 的 1-based 约定处理分类标签，
#   直接运行会在 label 校验处报错。需给数据集加 label offset/base，或
#   把 CSV 标签重编码为 {1,2} 后再跑。其余分类任务均为 1-based，不受影响。
data:
  dataset_type: VideoCSVDataset
  datasets:
  - /home/data/sdc/FAVOR/DATASET/splits-0901/2_RAVDESS_SV.csv
  datasets_weights:
  - 1
  rootpaths:
  - /home/data/sdb/基座模型数据集/2情绪数据集/RAVDESS/
  batch_size: 64
  crop_size: 112
  patch_size: 16
  dataset_fpcs:
  - 48
  tubelet_size: 2
  fps: 4
  num_workers: 8
  persistent_workers: true
  pin_mem: true
  num_clips: 1

  task: classification
  num_class: 2
  # Column containing integer class labels or floating-point regression targets.
  label_column: intensity

data_aug:
  random_resize_aspect_ratio: [0.85, 1.15]
  random_resize_scale: [0.6, 1.0]
  random_horizontal_flip: 0.5
  reprob: 0.0
