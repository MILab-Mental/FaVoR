optimization:
  epochs: 100
  backbone_lr: 2.0e-5
  head_lr: 1.0e-3
  final_lr: 1.0e-6
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  grokfast: false
  grokfast_alpha: 0.98
  grokfast_lambda: 2.0
  loss:
    classification:
      name: cross_entropy
      class_weighting: none
      label_smoothing: 0.0
    multi_label_classification:
      name: bce_with_logits
      positive_weighting: none
    regression:
      name: mse
