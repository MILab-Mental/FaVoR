model:
  model_name: vit_large
  uniform_power: true
  use_activation_checkpointing: true
  use_rope: true
  use_sdpa: true
  use_silu: false
  wide_silu: true
  # out_layers: [23]
  out_layers: [17, 19, 21, 23]
  classifier_depth: 1
  classifier_num_heads: 16
  instance_aggregator:
    pooling: attention
    hidden_dim: 256
    dropout: 0.0
    head_dropout: 0.0
