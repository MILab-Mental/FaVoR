model:
  name: aemojepa_plus_large_50hz
  backbone:
    mode: aemojepa
  extractor:
    conv_layers:
      - [512, 10, 5]
      - [512, 3, 2]
      - [512, 3, 2]
      - [512, 3, 2]
      - [512, 3, 2]
      - [512, 2, 2]
      - [512, 2, 2]
    mode: layer_norm
    conv_bias: false
    dropout: 0.0
  encoder:
    depth: 8
    d_model: 1024
    nhead: 16
    dim_feedforward: 4096
    dropout: 0.0
    qkv_bias: true
  features:
    mode: topk_average
    topk_layers: 8
  target:
    topk_layers: 8
  head:
    num_heads: 4
    hidden_dim: 256
    attention_dropout: 0.0
    dropout: 0.1
