data:
  num_sentence: 8
  sentence_eval_stride: 1
  batch_size: 1
  num_workers: 4
  sample_rate: 16000
  # Short paired media is zero-padded; sync remains strict.
  short_policy: zero_pad
  minimum_seconds: 0.1
  global_seconds: 6.0
  video_fps: 8
  video_frames_global: 48
  video_global_size: 112
  normalize_audio: true
  on_decode_error: error
  sync:
    strict: true
    require_same_source_id: true
    require_same_start: true
    require_same_duration: true
    duration_tolerance_seconds: 0.02
    offset_tolerance_seconds: 0.0
    on_mismatch: error
