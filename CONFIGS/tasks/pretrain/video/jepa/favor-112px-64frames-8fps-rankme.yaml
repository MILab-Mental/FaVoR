# 预训练 + 表征质量监控（RankMe / Hessian trace）
#
# 与 pretrain_v_FaVoR-112px-48f.yaml 相同的预训练设置（112px / 48f / vit-l / 150ep），
# 额外在 meta 下开启两个「checkpoint 表征质量」指标：
#
#   eval_freq       1       每 N 个 epoch 构成一次 evaluation event
#   rankme          every_epoch 在固定 eval 子集上计算在线 encoder 特征的有效秩
#                            （global 全局池化特征，SVD，约 4096 个样本，跨 checkpoint 可比）
#   hessian_trace   每隔 10 个 event 在固定小 batch 上用 Hutchinson 估计训练损失 Hessian 的迹
#
# 训练产物差异：
#   * 未开启指标时：best_loss.pt（最小平均 loss）
#   * 开启（任意）指标时：除 best_loss.pt 外，还会按 event 落盘 log_eval.csv，
#     并保存 best_rankme.pt（RankMe 最大）/ best_trace.pt（Hessian 迹最小）
#
# 注意输出目录独立（.../FaVoR-112px-48f-rep），避免覆盖主训练输出。
app: pretrain_v
folder: OUTPUT/pretrain_v/vitl16/FaVoR-112px-64f16-rankme
meta:
  dtype: bfloat16
  eval_freq: 1
  load_checkpoint: true
  read_checkpoint: CKPT/vjepa2/vitl.pt
  reset_epoch: true
  save_every_freq: 5
  seed: 239
  # ---- 表征质量指标（可选块；缺省即关闭，仅按 loss 保存 best_loss.pt）----
  rankme:
    enabled: true
    every_events: 1        # 每 2 个 evaluation event 算一次 RankMe
    subset_frac: 0.005     # 固定 eval 子集占全量比例（2.7M -> ~13k，再被 max_samples 封顶）
    max_samples: 4096      # 子集样本数上限（可配，越小越省）
    feature: global        # global=全局池化 / tokens=逐 clip token / both=两者
    seed: 2024             # 子集抽样的固定种子（保证跨 checkpoint 同一批视频）
  # hessian_trace:
  #   enabled: true
  #   every_events: 10       # 每 10 个 event 算一次 Hessian 迹（贵，故频率低）
  #   n_hutchinson: 5        # Hutchinson 随机向量数
  #   n_clips: 1             # 固定 batch 的 clip 数（迹对 batch 大小线性，故固定以可比）
  #   seed: 2024             # Hutchinson 随机向量种子（固定 -> 跨 checkpoint 可比）
yamls:
  data: CONFIGS/data/pretrain/video/jepa/112px-64frames-8fps.yaml
  opt: CONFIGS/optimization/pretrain/video/jepa/epochs150-warmup40-lr0.000525.yaml
  model: CONFIGS/models/pretrain/video/jepa/vit-l.yaml
  mask: CONFIGS/losses/video-jepa.yaml
