# Reproduces the original RAVDESS run through the
# current finetune_v entry point.
app: finetune_v
folder: OUTPUT/finetune_v/vitl16/RAVDESS-emotion/reproduce-stage1-latest/
meta:
  dtype: bfloat16
  eval_freq: 1
  load_checkpoint: true
  read_checkpoint: OUTPUT/pretrain_v/vitl16/voxceleb2-face/latest.pt
  reset_epoch: true
  save_every_freq: 100
  seed: 239
yamls:
  data: CONFIGS/datas/vfinetune/cls/RAVDESS-emotion-cls8.yaml
  sampling: CONFIGS/datas/vfinetune/128-step2-RAVDESS-reproduce.yaml
  opt: CONFIGS/opt/vfinetune-opt-ravdess-reproduce.yaml
  model: CONFIGS/models/vfinetune-vit-l-reproduce.yaml
