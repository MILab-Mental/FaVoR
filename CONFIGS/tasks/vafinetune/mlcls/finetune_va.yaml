app: finetune_va
folder: OUTPUT/finetune_va/mlcls
meta:
  seed: 0
  auto_resume: true
  read_checkpoint: null
data:
  task: multi_label_classification
  label_column: label
  num_class: 2
  manifests:
  - DATASET/merged/finetune_va_canonical.csv
  local_views: 0
finetune:
  pretrained_checkpoint: OUTPUT/pretrain_va_lejepa/I3-C1/latest.pt
  branch_aggregation: separate_logits
  freeze_video_encoder: false
  freeze_audio_encoder: false
  freeze_fusion_adapter: false
  video_lr_scale: 0.05
  audio_lr_scale: 0.05
  fusion_lr_scale: 0.2
  head_lr_scale: 1.0
  early_stopping_patience: 10
yamls:
  data: CONFIGS/datas/vafinetune/va-6s.yaml
  model: CONFIGS/models/vafinetune-vitl-emotion2vec.yaml
  opt: CONFIGS/opt/vafinetune-opt.yaml
