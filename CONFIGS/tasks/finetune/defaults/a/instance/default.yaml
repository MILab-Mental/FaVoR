# CSV supplies dataset, label, task, output directory and explicit checkpoint.
app: finetune_a
meta:
  dtype: bfloat16
  load_checkpoint: true
  reset_epoch: true
  seed: 239
  frozen_encoder: false
  min_load_ratio: 0.95
yamls:
  sampling: CONFIGS/data/finetune/audio/sampling/audio-4s-8sentences.yaml
  opt: CONFIGS/optimization/finetune/audio/epochs100-warmup0.yaml
  model: CONFIGS/models/finetune/audio/emotion2vec-plus-large-instance.yaml
  common: CONFIGS/tasks/finetune/default.yaml
