# CSV supplies dataset, label, task, output directory and explicit checkpoint.
app: finetune_v
meta:
  frozen_encoder: false
  dtype: bfloat16
  eval_freq: 1
  load_checkpoint: true
  reset_epoch: true
  save_every_freq: 100
  seed: 239
yamls:
  sampling: CONFIGS/data/finetune/video/sampling/48frames-8fps-8sentences.yaml
  opt: CONFIGS/optimization/finetune/video/epochs80-warmup5-lr5e-05.yaml
  model: CONFIGS/models/finetune/video/vit-l-4layers-instance.yaml
  common: CONFIGS/tasks/finetune/default.yaml
