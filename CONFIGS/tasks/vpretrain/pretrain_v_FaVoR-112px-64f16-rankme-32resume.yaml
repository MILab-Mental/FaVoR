# 预训练续跑（RankMe / Hessian trace 监控）—— 从 FaVoR-112px-64f16-rankme 的 epoch 32 接着跑
#
# 与 pretrain_v_FaVoR-112px-64f16-rankme.yaml 完全相同的训练设置（112px / 64f16 / vit-l / 150ep），
# 只改三处用于「真续跑 + 新输出目录」：
#
#   folder          指向新的输出目录，不覆盖原 run 的任何产物
#   read_checkpoint 指向**原 run 的 latest.pt（epoch=32）**，不是主干初始化权重 vitl.pt
#   reset_epoch     false —— 恢复 epoch / optimizer / scaler，并靠 start_epoch*ipe
#                   快进 lr / wd / ema / mask 四个 scheduler（见 app/pretrain_v/train.py:403-408）
#
# 于是 start_epoch=32，训练从 label epoch 33 开始，共跑到 150。
#
# 注意：
#   * 代码里没有 makedirs，folder 必须事先存在（已创建）。
#   * log_r0.csv / log_r1.csv / log_eval.csv 是追加模式，新目录里从 epoch 33 开始记，
#     要画完整的 1..150 曲线的话把原目录的三个 csv 先拷进新目录即可（表头不会重复写）。
#   * best_loss / best_rankme / best_trace 的极值在新目录里重新起算，
#     所以新目录的 best_loss.pt 不一定是全训练的最优，跨 run 比较请用 log_eval.csv。
#   * 再次中断后要续跑：把下面的 read_checkpoint 注释掉，
#     加载路径会自动回落到本目录的 latest.pt（app/pretrain_v/train.py:217）。
app: pretrain_v
folder: /home/data/sdc/FAVOR/OUTPUT/pretrain_v/vitl16/FaVoR-112px-64f16-rankme-32resume
meta:
  dtype: bfloat16
  eval_freq: 1
  load_checkpoint: true
  read_checkpoint: /home/data/sdc/FAVOR/OUTPUT/pretrain_v/vitl16/FaVoR-112px-64f16-rankme/latest.pt
  reset_epoch: false
  save_every_freq: 5
  seed: 239
  # ---- 表征质量指标（可选块；缺省即关闭，仅按 loss 保存 best_loss.pt）----
  rankme:
    enabled: true
    every_events: 1        # 每 2 个 evaluation event 算一次 RankMe
    subset_frac: 0.005     # 固定 eval 子集占全量比例（2.7M -> ~13k，再被 max_samples 封顶）
    max_samples: 4096      # 子集样本数上限（可配，越小越省）
    feature: global        # global=全局池化 / tokens=逐 clip token / both=两者
    seed: 2024             # 子集抽样的固定种子（保证跨 checkpoint 同一批视频）
  hessian_trace:
    enabled: true
    every_events: 10       # 每 10 个 event 算一次 Hessian 迹（贵，故频率低）
    n_hutchinson: 5        # Hutchinson 随机向量数
    n_clips: 1             # 固定 batch 的 clip 数（迹对 batch 大小线性，故固定以可比）
    seed: 2024             # Hutchinson 随机向量种子（固定 -> 跨 checkpoint 可比）
yamls:
  data: /home/data/sdc/FAVOR/CONFIGS/datas/vpretrain/vpretrain-data-64-16.yaml
  opt: /home/data/sdc/FAVOR/CONFIGS/opt/vpretrain-opt-s5000-150-40.yaml
  model: /home/data/sdc/FAVOR/CONFIGS/models/vpretrain-vit-l.yaml
  mask: /home/data/sdc/FAVOR/CONFIGS/mask_loss/vjepa-pretrain.yaml
